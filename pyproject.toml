[build-system]
requires = ["hatchling>=1.23"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experiments", "src/sparse_signal_loop", "src/longbenchpro", "src/longbenchpro_rlm", "src/mini_swe_agent_plus", "src/mini_swe_agent_plus_rlm"]

[project]
name = "sparse-signal-loop"
version = "0.1.0"
description = "Experiments on feedback, working memory, and reusable skills for LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "httpx",
    "jinja2",
    "numpy",
    "prime-sandboxes>=0.2.13",
    "pytrec-eval-terrier",
    "requests",
    "swebench==4.1.0",
    "tenacity",
    "verifiers>=0.1.12.dev1",
]

[project.scripts]
ssl-phase0-lbp = "experiments.phase0.lbp.cli:main"
ssl-phase0-msap = "experiments.phase0.mini_swe.cli:main"
ssl-phase1-lbp = "experiments.phase1.lbp.cli:main"
ssl-phase1-msap = "experiments.phase1.mini_swe.cli:main"
ssl-phase2-lbp = "experiments.phase2.lbp.cli:main"
ssl-phase2-msap = "experiments.phase2.mini_swe.cli:main"
ssl-experiment-report = "experiments.report_cli:main"

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Focused set: correctness + import order + unused args (no broad B/SIM/UP churn on env code).
select = ["E4", "E7", "E9", "F", "I", "ARG"]
ignore = [
    "E501", # line length
]

[tool.ruff.format]
quote-style = "double"

